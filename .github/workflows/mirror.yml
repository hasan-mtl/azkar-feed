name: Mirror

# Copies the app's feed (and any content pack it names) from the website every 15 minutes, so phones can read it
# here even if the website ever stops. A monthly heartbeat keeps the schedule from being paused for inactivity.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the feed
        run: |
          set -euo pipefail
          SITE=https://azkar-kafela.vercel.app
          if curl -fsS --max-time 30 "$SITE/api/feed" -o feed.new.json && python3 -c 'import json,sys; d=json.load(open("feed.new.json")); assert d.get("v")==1 and isinstance(d.get("messages"),list)'; then
            mv feed.new.json feed.json
            ver=$(python3 -c 'import json; print((json.load(open("feed.json")).get("content") or {}).get("version",""))')
            if [ -n "$ver" ] && [ ! -s "content/$ver.json" ]; then
              curl -fsS --max-time 60 "$SITE/api/content/$ver" -o "content/$ver.json.new" && python3 -c "import json,sys; d=json.load(open('content/$ver.json.new')); assert d.get('v')==1 and 'duas' in d" && mv "content/$ver.json.new" "content/$ver.json" || rm -f "content/$ver.json.new"
            fi
          else
            echo "website not reachable, keeping the last copy"; rm -f feed.new.json
          fi
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "azkar-feed"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            last=$(git log -1 --format=%ct)
            if [ $(( $(date +%s) - last )) -gt $(( 30 * 86400 )) ]; then
              date -u +%Y-%m-%dT%H:%M:%SZ > heartbeat.txt
              git add heartbeat.txt
              git commit -m "Heartbeat"
              git push
            fi
          else
            git commit -m "Update feed"
            git push
          fi
